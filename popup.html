<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionEase Accessibility Controls</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1 class="title">VisionEase</h1>
    <a href="#" id="openOptions" class="options-link" role="button" aria-label="Open detailed settings">Options</a>
  </header>

  <main class="main" id="main-content">
    <!-- Preset Profiles -->
    <section class="control-group" aria-labelledby="profile-heading">
      <h2 id="profile-heading" class="group-title">Accessibility Profile</h2>
      <select id="profileSelect" class="input-select" aria-label="Select accessibility preset">
        <option value="standard">Standard Default</option>
        <option value="lowVision">Low Vision Presets</option>
        <option value="highContrast">High Contrast Focus</option>
        <option value="readingFocus">Reading Assistance</option>
        <option value="reducedMotion">Reduced Motion</option>
      </select>
    </section>

    <!-- Typography Controls -->
    <section class="control-group" aria-labelledby="text-heading">
      <h2 id="text-heading" class="group-title">Typography</h2>
      
      <div class="field">
        <label for="fontSize" class="field-label">Text Scaling (<span id="fontSizeVal">100%</span>)</label>
        <input type="range" id="fontSize" min="0.8" max="2.0" step="0.1" value="1.0" class="input-range">
      </div>

      <div class="field">
        <label for="lineHeight" class="field-label">Line Spacing (<span id="lineHeightVal">1.5</span>)</label>
        <input type="range" id="lineHeight" min="1.0" max="2.5" step="0.1" value="1.5" class="input-range">
      </div>

      <div class="field-checkbox">
        <input type="checkbox" id="fontWeightBoost" class="input-checkbox">
        <label for="fontWeightBoost" class="checkbox-label">Bold Text Weight</label>
      </div>
    </section>

    <!-- Contrast & Display -->
    <section class="control-group" aria-labelledby="contrast-heading">
      <h2 id="contrast-heading" class="group-title">Contrast & Color</h2>
      
      <select id="contrastMode" class="input-select" aria-label="Select Contrast Theme">
        <option value="none">Original Colors</option>
        <option value="high-contrast-yellow">High Contrast Yellow on Black</option>
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
      </select>
    </section>

    <!-- Assistance & Focus -->
    <section class="control-group" aria-labelledby="assistance-heading">
      <h2 id="assistance-heading" class="group-title">Assistive Enhancements</h2>
      
      <div class="field-checkbox">
        <input type="checkbox" id="enhancedFocus" class="input-checkbox">
        <label for="enhancedFocus" class="checkbox-label">High-Visibility Focus Indicators</label>
      </div>

      <div class="field-checkbox">
        <input type="checkbox" id="oversizedCursor" class="input-checkbox">
        <label for="oversizedCursor" class="checkbox-label">Oversized High-Contrast Cursor</label>
      </div>

      <div class="field-checkbox">
        <input type="checkbox" id="reduceMotion" class="input-checkbox">
        <label for="reduceMotion" class="checkbox-label">Disable Animations & Transitions</label>
      </div>
    </section>

    <div class="actions">
      <button id="resetBtn" class="btn btn-secondary" type="button">Reset Defaults</button>
    </div>
  </main>

  <script src="../utils/storage.js"></script>
  <script src="../utils/profiles.js"></script>
  <script src="popup.js"></script>
</body>
</html>
